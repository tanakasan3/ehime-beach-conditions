<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛媛ビーチコンディション | Ehime Beach Conditions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            color: #00d9ff;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }
        
        .subtitle {
            color: #888;
            font-size: 1.1rem;
        }
        
        .last-updated {
            color: #666;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .quick-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .quick-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 10px 18px;
            color: #00d9ff;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .quick-link:hover {
            background: rgba(0, 217, 255, 0.15);
            border-color: rgba(0, 217, 255, 0.3);
            transform: translateY(-2px);
        }

        .quick-link-icon {
            font-size: 1.1rem;
        }

        .beaches {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        @media (max-width: 1000px) {
            .beaches {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .beaches {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        .beach-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
            cursor: pointer;
        }
        
        .beach-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .beach-card.expanded {
            grid-column: 1 / -1;
            cursor: default;
        }
        
        .beach-name {
            font-size: 1.15rem;
            color: #fff;
            margin-bottom: 2px;
        }
        
        .beach-name-en {
            color: #666;
            font-size: 0.75rem;
            margin-bottom: 12px;
        }

        .day-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            justify-content: center;
        }

        .day-tab {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 6px 10px;
            color: #888;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .day-tab:hover {
            background: rgba(0, 217, 255, 0.1);
            color: #00d9ff;
        }

        .day-tab.active {
            background: rgba(0, 217, 255, 0.2);
            border-color: rgba(0, 217, 255, 0.4);
            color: #00d9ff;
        }

        .day-tab-date {
            display: block;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .day-tab-day {
            display: block;
            font-size: 0.65rem;
            opacity: 0.7;
        }
        
        .wind-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .wind-arrow {
            font-size: 2rem;
            color: #00d9ff;
            transition: transform 0.5s ease;
            text-shadow: 0 0 15px rgba(0, 217, 255, 0.5);
        }
        
        .wind-info {
            text-align: left;
        }
        
        .wind-speed {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
        }
        
        .wind-speed-unit {
            font-size: 0.85rem;
            color: #888;
        }
        
        .wind-cardinal {
            color: #00d9ff;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .wind-range {
            font-size: 0.7rem;
            color: #666;
            margin-top: 2px;
        }

        .daytime-label {
            font-size: 0.65rem;
            color: #555;
            margin-top: 8px;
        }

        .click-hint {
            font-size: 0.65rem;
            color: #444;
            margin-top: 8px;
        }

        .beach-card:not(.expanded) .click-hint::after {
            content: "タップで詳細";
        }

        /* Expanded hourly view */
        .hourly-detail {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .beach-card.expanded .hourly-detail {
            display: block;
        }

        .hourly-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .hourly-title {
            font-size: 1rem;
            color: #fff;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #888;
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .hourly-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
            gap: 8px;
            max-width: 100%;
        }

        .hour-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
        }

        .hour-item.daytime {
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.2);
        }

        .hour-time {
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 4px;
        }

        .hour-arrow {
            font-size: 1.2rem;
            color: #00d9ff;
            display: block;
            margin-bottom: 2px;
        }

        .hour-speed {
            font-size: 0.8rem;
            font-weight: bold;
            color: #fff;
        }

        .hour-cardinal {
            font-size: 0.6rem;
            color: #666;
        }

        .tide-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }
        
        .tide-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .tide-title {
            font-size: 1.5rem;
            color: #fff;
        }
        
        .tide-title-sub {
            color: #666;
            font-size: 0.9rem;
        }
        
        .tide-chart-container {
            position: relative;
            width: 100%;
            height: 250px;
            margin-bottom: 15px;
        }
        
        .tide-chart {
            width: 100%;
            height: 100%;
        }
        
        .tide-events {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        
        .tide-event {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        
        .tide-event.high {
            border-left: 3px solid #00d9ff;
        }
        
        .tide-event.low {
            border-left: 3px solid #ff6b6b;
        }
        
        .tide-event-type {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        
        .tide-event.high .tide-event-type {
            color: #00d9ff;
        }
        
        .tide-event.low .tide-event-type {
            color: #ff6b6b;
        }
        
        .tide-event-time {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }
        
        .tide-event-height {
            font-size: 0.9rem;
            color: #888;
        }
        
        .tide-event-date {
            font-size: 0.75rem;
            color: #555;
            margin-top: 3px;
        }
        
        .refresh-btn {
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.3);
            color: #00d9ff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .refresh-btn:hover {
            background: rgba(0, 217, 255, 0.3);
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 217, 255, 0.1);
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            background: rgba(255, 100, 100, 0.1);
            border: 1px solid rgba(255, 100, 100, 0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            color: #ff6b6b;
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: #444;
            font-size: 0.85rem;
        }
        
        footer a {
            color: #00d9ff;
            text-decoration: none;
        }

        .terminal-section {
            background: #0d1117;
            border-radius: 12px;
            border: 1px solid #30363d;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .terminal-header {
            background: #161b22;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #30363d;
        }

        .terminal-dots {
            display: flex;
            gap: 6px;
        }

        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .terminal-dot.red { background: #ff5f56; }
        .terminal-dot.yellow { background: #ffbd2e; }
        .terminal-dot.green { background: #27ca40; }

        .terminal-title {
            color: #8b949e;
            font-size: 0.85rem;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        }

        .terminal-tabs {
            display: flex;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            overflow-x: auto;
        }

        .terminal-tab {
            padding: 10px 16px;
            color: #8b949e;
            font-size: 0.8rem;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            cursor: pointer;
            border: none;
            background: transparent;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .terminal-tab:hover {
            color: #c9d1d9;
            background: rgba(255, 255, 255, 0.05);
        }

        .terminal-tab.active {
            color: #00d9ff;
            border-bottom-color: #00d9ff;
        }

        .terminal-body {
            padding: 16px;
            max-height: 400px;
            overflow: auto;
        }

        .terminal-content {
            display: none;
        }

        .terminal-content.active {
            display: block;
        }

        .terminal-pre {
            margin: 0;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.8rem;
            line-height: 1.5;
            color: #c9d1d9;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .terminal-url {
            color: #8b949e;
            font-size: 0.75rem;
            margin-bottom: 12px;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .terminal-url-method {
            color: #3fb950;
            font-weight: bold;
        }

        .terminal-url-path {
            color: #58a6ff;
        }

        .json-key { color: #79c0ff; }
        .json-string { color: #a5d6ff; }
        .json-number { color: #ffa657; }
        .json-boolean { color: #ff7b72; }
        .json-null { color: #8b949e; }
        .json-bracket { color: #8b949e; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌊 愛媛ビーチコンディション</h1>
            <p class="subtitle">Ehime Beach Conditions</p>
            <p class="last-updated" id="lastUpdated">Loading...</p>
        </header>

        <div class="quick-links">
            <a href="https://tenki.jp/amedas/8/41/73168.html" target="_blank" class="quick-link">
                <span class="quick-link-icon">📡</span>
                松山南吉田のアメダス
            </a>
            <a href="https://tenki.jp/forecast/8/41/7310/38201/1hour.html" target="_blank" class="quick-link">
                <span class="quick-link-icon">🌤</span>
                松山市の天気
            </a>
            <a href="https://supercweather.com/" target="_blank" class="quick-link">
                <span class="quick-link-icon">🤥</span>
                SCW(嘘つき)
            </a>
            <a href="https://weather.yahoo.com/jp/ehime-prefecture/matsuyama-shi" target="_blank" class="quick-link">
                <span class="quick-link-icon">☀️</span>
                ヤフー天気予報
            </a>
        </div>

        <div id="beaches" class="beaches">
            <div class="loading" style="grid-column: 1 / -1;">
                <div class="loading-spinner"></div>
                <p>データを取得中...</p>
            </div>
        </div>

        <div class="tide-section">
            <div class="tide-header">
                <div>
                    <h2 class="tide-title">🌙 松山潮汐チャート</h2>
                    <p class="tide-title-sub">Matsuyama Tide Chart - Next 48 Hours</p>
                </div>
                <button class="refresh-btn" onclick="refreshData()">🔄 更新</button>
            </div>
            <div class="tide-chart-container">
                <canvas id="tideChart" class="tide-chart"></canvas>
            </div>
            <div id="tideEvents" class="tide-events"></div>
        </div>

        <div class="terminal-section">
            <div class="terminal-header">
                <div class="terminal-dots">
                    <div class="terminal-dot red"></div>
                    <div class="terminal-dot yellow"></div>
                    <div class="terminal-dot green"></div>
                </div>
                <span class="terminal-title">API Response</span>
            </div>
            <div class="terminal-tabs" id="terminalTabs"></div>
            <div class="terminal-body" id="terminalBody"></div>
        </div>

        <footer>
            <p>Data from <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a> (Weather & Marine API)</p>
            <p style="margin-top: 10px;">⚡ Built by SierraVictor</p>
        </footer>
    </div>

    <script>
        // Beach locations in Ehime Prefecture
        const beaches = [
            {
                name: '塩屋海岸',
                nameEn: 'Shioya Beach',
                lat: 33.799102,
                lon: 132.690173,
            },
            {
                name: '堀江',
                nameEn: 'Horie Beach',
                lat: 33.905024,
                lon: 132.739466,
            },
            {
                name: '別府',
                nameEn: 'Beppu Beach',
                lat: 34.067622,
                lon: 132.899053,
            },
            {
                name: '織田ヶ浜',
                nameEn: 'Odagahama Beach',
                lat: 34.042646,
                lon: 133.033807,
            },
            {
                name: 'モンチッチ',
                nameEn: 'Monchicchi',
                lat: 33.984441,
                lon: 132.771392,
            }
        ];

        // Matsuyama coordinates for tide data
        const matsuyama = { lat: 33.8392, lon: 132.7656 };

        // Store API responses for terminal display
        const apiResponses = {};

        // Store beach data for expanded view
        const beachData = {};

        // Currently expanded beach
        let expandedBeach = null;

        // Selected day index per beach
        const selectedDays = {};

        // Convert degrees to cardinal direction
        function degreesToCardinal(deg) {
            if (deg === null || deg === undefined) return '-';
            const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 
                              'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            const index = Math.round(deg / 22.5) % 16;
            return directions[index];
        }

        // Format time for display
        function formatTime(date) {
            return date.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                timeZoneName: 'short'
            });
        }

        // Get day label
        function getDayLabel(dateStr, index) {
            const date = new Date(dateStr);
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            const dayName = days[date.getDay()];
            
            if (index === 0) return { date: '今日', day: dayName };
            if (index === 1) return { date: '明日', day: dayName };
            return { 
                date: `${date.getMonth() + 1}/${date.getDate()}`, 
                day: dayName 
            };
        }

        // Get daytime hours (9am-5pm) for a specific date
        function getDaytimeData(hourlyData, dateStr) {
            const targetDate = dateStr.split('T')[0];
            const daytimeHours = [];
            
            for (let i = 0; i < hourlyData.time.length; i++) {
                const time = hourlyData.time[i];
                if (time.startsWith(targetDate)) {
                    const hour = parseInt(time.split('T')[1].split(':')[0]);
                    if (hour >= 9 && hour <= 17) {
                        daytimeHours.push({
                            time: time,
                            hour: hour,
                            windSpeed: hourlyData.wind_speed_10m[i],
                            windDir: hourlyData.wind_direction_10m[i]
                        });
                    }
                }
            }
            return daytimeHours;
        }

        // Get all hours for a specific date
        function getAllHoursData(hourlyData, dateStr) {
            const targetDate = dateStr.split('T')[0];
            const hours = [];
            
            for (let i = 0; i < hourlyData.time.length; i++) {
                const time = hourlyData.time[i];
                if (time.startsWith(targetDate)) {
                    const hour = parseInt(time.split('T')[1].split(':')[0]);
                    hours.push({
                        time: time,
                        hour: hour,
                        windSpeed: hourlyData.wind_speed_10m[i],
                        windDir: hourlyData.wind_direction_10m[i],
                        isDaytime: hour >= 9 && hour <= 17
                    });
                }
            }
            return hours;
        }

        // Summarize wind data for daytime
        function summarizeDaytime(daytimeData) {
            if (daytimeData.length === 0) return null;
            
            const speeds = daytimeData.map(d => d.windSpeed).filter(s => s !== null);
            const dirs = daytimeData.map(d => d.windDir).filter(d => d !== null);
            
            if (speeds.length === 0) return null;
            
            // Calculate average direction using circular mean
            let sinSum = 0, cosSum = 0;
            dirs.forEach(d => {
                sinSum += Math.sin(d * Math.PI / 180);
                cosSum += Math.cos(d * Math.PI / 180);
            });
            const avgDir = Math.atan2(sinSum / dirs.length, cosSum / dirs.length) * 180 / Math.PI;
            const normalizedDir = (avgDir + 360) % 360;
            
            return {
                avgSpeed: speeds.reduce((a, b) => a + b, 0) / speeds.length,
                minSpeed: Math.min(...speeds),
                maxSpeed: Math.max(...speeds),
                avgDir: normalizedDir
            };
        }

        // Get unique dates from hourly data
        function getUniqueDates(hourlyData) {
            const dates = new Set();
            hourlyData.time.forEach(t => dates.add(t.split('T')[0]));
            return Array.from(dates).slice(0, 3); // First 3 days
        }

        // JSON syntax highlighting
        function syntaxHighlight(json) {
            if (typeof json !== 'string') {
                json = JSON.stringify(json, null, 2);
            }
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                        match = match.slice(0, -1) + '</span><span class="json-bracket">:</span>';
                        return '<span class="' + cls + '">' + match;
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            }).replace(/([{}\[\]])/g, '<span class="json-bracket">$1</span>');
        }

        // Render terminal tabs and content
        function renderTerminal() {
            const tabsContainer = document.getElementById('terminalTabs');
            const bodyContainer = document.getElementById('terminalBody');
            
            const entries = Object.entries(apiResponses);
            if (entries.length === 0) {
                tabsContainer.innerHTML = '';
                bodyContainer.innerHTML = '<p style="color: #8b949e; font-family: monospace;">Waiting for API responses...</p>';
                return;
            }
            
            tabsContainer.innerHTML = entries.map(([key, data], index) => 
                `<button class="terminal-tab ${index === 0 ? 'active' : ''}" onclick="switchTab('${key}')">${data.label}</button>`
            ).join('');
            
            bodyContainer.innerHTML = entries.map(([key, data], index) => `
                <div class="terminal-content ${index === 0 ? 'active' : ''}" id="terminal-${key}">
                    <div class="terminal-url">
                        <span class="terminal-url-method">GET</span>
                        <span class="terminal-url-path">${data.url}</span>
                    </div>
                    <pre class="terminal-pre">${syntaxHighlight(data.response)}</pre>
                </div>
            `).join('');
        }

        function switchTab(key) {
            document.querySelectorAll('.terminal-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.terminal-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`terminal-${key}`).classList.add('active');
        }

        // Fetch weather data with hourly forecast
        async function fetchWeatherData(lat, lon, beachName) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms&timezone=Asia/Tokyo&forecast_days=3`;
            const response = await fetch(url);
            const data = await response.json();
            
            apiResponses[`weather-${beachName}`] = {
                label: `🌤 ${beachName}`,
                url: url,
                response: data
            };
            
            return data;
        }

        // Fetch marine/tide data
        async function fetchTideData(lat, lon) {
            const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=sea_level_height_msl&timezone=Asia/Tokyo&forecast_hours=48`;
            const response = await fetch(url);
            const data = await response.json();
            
            apiResponses['tide-matsuyama'] = {
                label: '🌊 Tide',
                url: url,
                response: data
            };
            
            return data;
        }

        // Render beach card
        function renderBeachCard(beach, weatherData) {
            const beachKey = beach.name;
            const dates = getUniqueDates(weatherData.hourly);
            const selectedDay = selectedDays[beachKey] || 0;
            const currentDate = dates[selectedDay];
            
            // Store data for expanded view
            beachData[beachKey] = { beach, weatherData, dates };
            
            const daytimeData = getDaytimeData(weatherData.hourly, currentDate + 'T00:00');
            const summary = summarizeDaytime(daytimeData);
            
            const isExpanded = expandedBeach === beachKey;
            
            let windDisplay = '-';
            let windDir = 0;
            let windCardinal = '-';
            let windRange = '';
            
            if (summary) {
                windDisplay = summary.avgSpeed.toFixed(1);
                windDir = summary.avgDir;
                windCardinal = degreesToCardinal(summary.avgDir);
                windRange = `${summary.minSpeed.toFixed(1)}-${summary.maxSpeed.toFixed(1)}`;
            }
            
            // Day tabs HTML
            const dayTabsHtml = dates.map((date, idx) => {
                const label = getDayLabel(date, idx);
                return `
                    <div class="day-tab ${idx === selectedDay ? 'active' : ''}" 
                         onclick="event.stopPropagation(); selectDay('${beachKey}', ${idx})">
                        <span class="day-tab-date">${label.date}</span>
                        <span class="day-tab-day">${label.day}</span>
                    </div>
                `;
            }).join('');
            
            // Hourly detail HTML (shown when expanded)
            let hourlyHtml = '';
            if (isExpanded) {
                const allHours = getAllHoursData(weatherData.hourly, currentDate + 'T00:00');
                hourlyHtml = `
                    <div class="hourly-detail">
                        <div class="hourly-header">
                            <span class="hourly-title">⏰ 時間別データ (${getDayLabel(currentDate, selectedDay).date})</span>
                            <button class="close-btn" onclick="event.stopPropagation(); collapseBeach()">✕ 閉じる</button>
                        </div>
                        <div class="hourly-grid">
                            ${allHours.map(h => `
                                <div class="hour-item ${h.isDaytime ? 'daytime' : ''}">
                                    <div class="hour-time">${h.hour}:00</div>
                                    <span class="hour-arrow" style="transform: rotate(${h.windDir || 0}deg)">↓</span>
                                    <div class="hour-speed">${h.windSpeed !== null ? h.windSpeed.toFixed(1) : '-'}</div>
                                    <div class="hour-cardinal">${degreesToCardinal(h.windDir)}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            return `
                <div class="beach-card ${isExpanded ? 'expanded' : ''}" 
                     onclick="${isExpanded ? '' : `expandBeach('${beachKey}')`}">
                    <h2 class="beach-name">${beach.name}</h2>
                    <p class="beach-name-en">${beach.nameEn}</p>
                    
                    <div class="day-tabs">
                        ${dayTabsHtml}
                    </div>
                    
                    <div class="wind-display">
                        <div class="wind-arrow" style="transform: rotate(${windDir}deg)">↓</div>
                        <div class="wind-info">
                            <div class="wind-speed">${windDisplay}<span class="wind-speed-unit"> m/s</span></div>
                            <div class="wind-cardinal">${windCardinal}</div>
                            <div class="wind-range">${windRange} m/s</div>
                        </div>
                    </div>
                    <div class="daytime-label">9:00-17:00 平均</div>
                    <div class="click-hint"></div>
                    ${hourlyHtml}
                </div>
            `;
        }

        // Select day for a beach
        function selectDay(beachKey, dayIndex) {
            selectedDays[beachKey] = dayIndex;
            renderBeaches();
        }

        // Expand beach to show hourly data
        function expandBeach(beachKey) {
            expandedBeach = beachKey;
            renderBeaches();
        }

        // Collapse expanded beach
        function collapseBeach() {
            expandedBeach = null;
            renderBeaches();
        }

        // Render all beaches
        function renderBeaches() {
            const container = document.getElementById('beaches');
            container.innerHTML = beaches.map(beach => {
                const data = beachData[beach.name];
                if (data) {
                    return renderBeachCard(data.beach, data.weatherData);
                }
                return '';
            }).join('');
        }

        // Find high and low tides from hourly data
        function findTideEvents(times, heights) {
            const events = [];
            for (let i = 1; i < heights.length - 1; i++) {
                if (heights[i] === null) continue;
                const prev = heights[i - 1];
                const curr = heights[i];
                const next = heights[i + 1];
                if (prev === null || next === null) continue;
                
                if (curr > prev && curr > next) {
                    events.push({ type: 'high', time: times[i], height: curr });
                } else if (curr < prev && curr < next) {
                    events.push({ type: 'low', time: times[i], height: curr });
                }
            }
            return events;
        }

        // Draw tide chart
        function drawTideChart(times, heights) {
            const canvas = document.getElementById('tideChart');
            const ctx = canvas.getContext('2d');
            
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            const width = rect.width;
            const height = rect.height;
            const padding = { top: 30, right: 20, bottom: 40, left: 50 };
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;
            
            const validData = heights.map((h, i) => ({ height: h, time: times[i], index: i }))
                                    .filter(d => d.height !== null);
            
            if (validData.length === 0) return;
            
            const minHeight = Math.min(...validData.map(d => d.height));
            const maxHeight = Math.max(...validData.map(d => d.height));
            const heightRange = maxHeight - minHeight || 1;
            
            ctx.clearRect(0, 0, width, height);
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            
            for (let i = 0; i <= 4; i++) {
                const y = padding.top + (chartHeight / 4) * i;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
                
                const heightVal = maxHeight - (heightRange / 4) * i;
                ctx.fillStyle = '#666';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(heightVal.toFixed(1) + 'm', padding.left - 8, y + 4);
            }
            
            ctx.fillStyle = '#666';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            
            for (let i = 0; i < times.length; i += 6) {
                const x = padding.left + (i / (times.length - 1)) * chartWidth;
                const date = new Date(times[i]);
                const hour = date.getHours();
                
                ctx.strokeStyle = hour === 0 ? 'rgba(255, 255, 255, 0.2)' : 'rgba(255, 255, 255, 0.05)';
                ctx.beginPath();
                ctx.moveTo(x, padding.top);
                ctx.lineTo(x, height - padding.bottom);
                ctx.stroke();
                
                ctx.fillStyle = '#666';
                const timeStr = date.toLocaleString('ja-JP', { hour: '2-digit', minute: '2-digit', hour12: false });
                ctx.fillText(timeStr, x, height - padding.bottom + 15);
                
                if (hour === 0) {
                    const dateStr = date.toLocaleString('ja-JP', { month: 'short', day: 'numeric' });
                    ctx.fillText(dateStr, x, height - padding.bottom + 28);
                }
            }
            
            if (minHeight < 0 && maxHeight > 0) {
                const zeroY = padding.top + ((maxHeight - 0) / heightRange) * chartHeight;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(padding.left, zeroY);
                ctx.lineTo(width - padding.right, zeroY);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            
            ctx.strokeStyle = '#00d9ff';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            
            let started = false;
            validData.forEach((d) => {
                const x = padding.left + (d.index / (times.length - 1)) * chartWidth;
                const y = padding.top + ((maxHeight - d.height) / heightRange) * chartHeight;
                
                if (!started) {
                    ctx.moveTo(x, y);
                    started = true;
                } else {
                    ctx.lineTo(x, y);
                }
            });
            ctx.stroke();
            
            const gradient = ctx.createLinearGradient(0, padding.top, 0, height - padding.bottom);
            gradient.addColorStop(0, 'rgba(0, 217, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 217, 255, 0.05)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            
            started = false;
            validData.forEach((d) => {
                const x = padding.left + (d.index / (times.length - 1)) * chartWidth;
                const y = padding.top + ((maxHeight - d.height) / heightRange) * chartHeight;
                
                if (!started) {
                    ctx.moveTo(x, height - padding.bottom);
                    ctx.lineTo(x, y);
                    started = true;
                } else {
                    ctx.lineTo(x, y);
                }
            });
            
            if (validData.length > 0) {
                const lastD = validData[validData.length - 1];
                const lastX = padding.left + (lastD.index / (times.length - 1)) * chartWidth;
                ctx.lineTo(lastX, height - padding.bottom);
            }
            ctx.closePath();
            ctx.fill();
            
            const now = new Date();
            const startTime = new Date(times[0]);
            const endTime = new Date(times[times.length - 1]);
            
            if (now >= startTime && now <= endTime) {
                const nowProgress = (now - startTime) / (endTime - startTime);
                const nowX = padding.left + nowProgress * chartWidth;
                
                ctx.strokeStyle = '#ff6b6b';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(nowX, padding.top);
                ctx.lineTo(nowX, height - padding.bottom);
                ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('NOW', nowX, padding.top - 8);
            }
            
            const events = findTideEvents(times, heights);
            events.forEach(event => {
                const idx = times.indexOf(event.time);
                const x = padding.left + (idx / (times.length - 1)) * chartWidth;
                const y = padding.top + ((maxHeight - event.height) / heightRange) * chartHeight;
                
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = event.type === 'high' ? '#00d9ff' : '#ff6b6b';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        // Render tide events
        function renderTideEvents(times, heights) {
            const events = findTideEvents(times, heights);
            const container = document.getElementById('tideEvents');
            
            if (events.length === 0) {
                container.innerHTML = '<p style="color: #666; text-align: center;">No tide events found</p>';
                return;
            }
            
            container.innerHTML = events.slice(0, 8).map(event => {
                const date = new Date(event.time);
                const timeStr = date.toLocaleString('ja-JP', { hour: '2-digit', minute: '2-digit', hour12: false });
                const dateStr = date.toLocaleString('ja-JP', { month: 'short', day: 'numeric', weekday: 'short' });
                const heightStr = (event.height >= 0 ? '+' : '') + event.height.toFixed(2) + 'm';
                const typeLabel = event.type === 'high' ? '満潮 High' : '干潮 Low';
                
                return `
                    <div class="tide-event ${event.type}">
                        <div class="tide-event-type">${typeLabel}</div>
                        <div class="tide-event-time">${timeStr}</div>
                        <div class="tide-event-height">${heightStr}</div>
                        <div class="tide-event-date">${dateStr}</div>
                    </div>
                `;
            }).join('');
        }

        // Main function to load all data
        async function loadAllData() {
            const beachContainer = document.getElementById('beaches');
            const lastUpdated = document.getElementById('lastUpdated');
            
            beachContainer.innerHTML = `
                <div class="loading" style="grid-column: 1 / -1;">
                    <div class="loading-spinner"></div>
                    <p>データを取得中...</p>
                </div>
            `;

            try {
                Object.keys(apiResponses).forEach(key => delete apiResponses[key]);

                const beachResults = await Promise.all(
                    beaches.map(async (beach) => {
                        const weather = await fetchWeatherData(beach.lat, beach.lon, beach.name);
                        return { beach, weather };
                    })
                );

                beachResults.forEach(({ beach, weather }) => {
                    beachData[beach.name] = { beach, weatherData: weather, dates: getUniqueDates(weather.hourly) };
                });

                renderBeaches();

                const tideData = await fetchTideData(matsuyama.lat, matsuyama.lon);
                
                if (tideData.hourly && tideData.hourly.time && tideData.hourly.sea_level_height_msl) {
                    drawTideChart(tideData.hourly.time, tideData.hourly.sea_level_height_msl);
                    renderTideEvents(tideData.hourly.time, tideData.hourly.sea_level_height_msl);
                }

                renderTerminal();

                lastUpdated.textContent = `最終更新: ${formatTime(new Date())}`;
            } catch (error) {
                console.error('Error fetching data:', error);
                beachContainer.innerHTML = `
                    <div class="error" style="grid-column: 1 / -1;">
                        <p>⚠️ データの取得に失敗しました</p>
                        <p>Failed to fetch data. Please try again.</p>
                        <p style="margin-top: 10px; font-size: 0.8rem;">${error.message}</p>
                    </div>
                `;
            }
        }

        function refreshData() {
            expandedBeach = null;
            Object.keys(selectedDays).forEach(k => delete selectedDays[k]);
            loadAllData();
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                const tideData = apiResponses['tide-matsuyama'];
                if (tideData && tideData.response.hourly) {
                    drawTideChart(tideData.response.hourly.time, tideData.response.hourly.sea_level_height_msl);
                }
            }, 250);
        });

        document.addEventListener('DOMContentLoaded', loadAllData);

        setInterval(loadAllData, 10 * 60 * 1000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

<body>
    <div class="container">
        <header>

                <div class="loading" style="grid-column: 1 / -1;">
                    <div class="loading-spinner"></div>

                </div>

        <div id="hourlyPanel" class="hourly-panel">
            <div class="hourly-header">
                <div>
                    <h3 class="hourly-title" id="hourlyTitle">-</h3>
                    <p class="hourly-subtitle" id="hourlySubtitle">24時間の風データ</p>
                </div>

            <div class="tide-header">
                <div>
                    <h2 class="tide-title">🌙 松山潮汐チャート</h2>

                </div>

        </div>

        <footer>
            <p>Data from <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a> (Weather & Marine API)</p>
            <p style="margin-top: 10px;">⚡ Built by SierraVictor</p>
        </footer>

    <script>
        // Beach locations in Ehime Prefecture
        const beaches = [
            { name: '塩屋海岸', nameEn: 'Shioya Beach', lat: 33.799102, lon: 132.690173 },
            { name: '堀江', nameEn: 'Horie Beach', lat: 33.905024, lon: 132.739466 },
            { name: '別府', nameEn: 'Beppu Beach', lat: 34.067622, lon: 132.899053 },
            { name: '織田ヶ浜', nameEn: 'Odagahama Beach', lat: 34.042646, lon: 133.033807 },
            { name: 'モンチッチ', nameEn: 'Monchicchi', lat: 33.984441, lon: 132.771392 }
        ];

        const matsuyama = { lat: 33.8392, lon: 132.7656 };
        const apiResponses = {};
        const beachData = {};
        let selectedCell = null;

        function degreesToCardinal(deg) {
            if (deg === null || deg === undefined) return '-';
            const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 
                              'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            return directions[Math.round(deg / 22.5) % 16];
        }

        function formatTime(date) {
            return date.toLocaleString('ja-JP', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', timeZoneName: 'short'
            });
        }

        function getDayLabel(dateStr, index) {
            const date = new Date(dateStr);
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            const dayName = days[date.getDay()];
            
            if (index === 0) return { date: '今日', day: dayName, full: dateStr };
            if (index === 1) return { date: '明日', day: dayName, full: dateStr };
            return { date: `${date.getMonth() + 1}/${date.getDate()}`, day: dayName, full: dateStr };
        }

        function getDaytimeData(hourlyData, dateStr) {
            const targetDate = dateStr.split('T')[0];
            const daytimeHours = [];
            
            for (let i = 0; i < hourlyData.time.length; i++) {
                const time = hourlyData.time[i];
                if (time.startsWith(targetDate)) {
                    const hour = parseInt(time.split('T')[1].split(':')[0]);
                    if (hour >= 9 && hour <= 17) {
                        daytimeHours.push({
                            time, hour,
                            windSpeed: hourlyData.wind_speed_10m[i],
                            windDir: hourlyData.wind_direction_10m[i]
                        });
                    }
                }
            }
            return daytimeHours;
        }

        function getAllHoursData(hourlyData, dateStr) {
            const targetDate = dateStr.split('T')[0];
            const hours = [];
            
            for (let i = 0; i < hourlyData.time.length; i++) {
                const time = hourlyData.time[i];
                if (time.startsWith(targetDate)) {
                    const hour = parseInt(time.split('T')[1].split(':')[0]);
                    hours.push({
                        time, hour,
                        windSpeed: hourlyData.wind_speed_10m[i],
                        windDir: hourlyData.wind_direction_10m[i],
                        isDaytime: hour >= 9 && hour <= 17
                    });
                }
            }
            return hours;
        }

        function summarizeDaytime(daytimeData) {
            if (daytimeData.length === 0) return null;
            
            const speeds = daytimeData.map(d => d.windSpeed).filter(s => s !== null);
            const dirs = daytimeData.map(d => d.windDir).filter(d => d !== null);
            
            if (speeds.length === 0) return null;
            
            let sinSum = 0, cosSum = 0;
            dirs.forEach(d => {
                sinSum += Math.sin(d * Math.PI / 180);
                cosSum += Math.cos(d * Math.PI / 180);
            });
            const avgDir = ((Math.atan2(sinSum / dirs.length, cosSum / dirs.length) * 180 / Math.PI) + 360) % 360;
            
            return {
                avgSpeed: speeds.reduce((a, b) => a + b, 0) / speeds.length,
                minSpeed: Math.min(...speeds),
                maxSpeed: Math.max(...speeds),
                avgDir
            };
        }

        function getUniqueDates(hourlyData) {
            const dates = new Set();
            hourlyData.time.forEach(t => dates.add(t.split('T')[0]));
            return Array.from(dates).slice(0, 3);
        }

        function syntaxHighlight(json) {
            if (typeof json !== 'string') json = JSON.stringify(json, null, 2);
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                        match = match.slice(0, -1) + '</span><span class="json-bracket">:</span>';
                        return '<span class="' + cls + '">' + match;
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            }).replace(/([{}\[\]])/g, '<span class="json-bracket">$1</span>');
        }

        function renderTerminal() {
            const tabsContainer = document.getElementById('terminalTabs');
            const bodyContainer = document.getElementById('terminalBody');
            
            const entries = Object.entries(apiResponses);
            if (entries.length === 0) {
                tabsContainer.innerHTML = '';
                bodyContainer.innerHTML = '<p style="color: #8b949e; font-family: monospace;">Waiting for API responses...</p>';
                return;
            }
            
            tabsContainer.innerHTML = entries.map(([key, data], index) => 
                `<button class="terminal-tab ${index === 0 ? 'active' : ''}" onclick="switchTab('${key}')">${data.label}</button>`
            ).join('');
            
            bodyContainer.innerHTML = entries.map(([key, data], index) => `
                <div class="terminal-content ${index === 0 ? 'active' : ''}" id="terminal-${key}">
                    <div class="terminal-url">
                        <span class="terminal-url-method">GET</span>
                        <span class="terminal-url-path">${data.url}</span>
                    </div>
                    <pre class="terminal-pre">${syntaxHighlight(data.response)}</pre>
                </div>
            `).join('');
        }

        function switchTab(key) {
            document.querySelectorAll('.terminal-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.terminal-content').forEach(content => content.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`terminal-${key}`).classList.add('active');
        }

        async function fetchWeatherData(lat, lon, beachName) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms&timezone=Asia/Tokyo&forecast_days=3`;
            const response = await fetch(url);
            const data = await response.json();
            
            apiResponses[`weather-${beachName}`] = { label: `🌤 ${beachName}`, url, response: data };
            return data;
        }

        async function fetchTideData(lat, lon) {
            const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=sea_level_height_msl&timezone=Asia/Tokyo&forecast_hours=48`;
            const response = await fetch(url);
            const data = await response.json();
            
            apiResponses['tide-matsuyama'] = { label: '🌊 Tide', url, response: data };
            return data;
        }

        function renderMatrix() {
            const container = document.getElementById('forecastMatrix');
            const dates = beachData[beaches[0].name]?.dates || [];
            
            if (dates.length === 0) {
                container.innerHTML = '<div class="error" style="grid-column: 1/-1;">No data available</div>';
                return;
            }

            let html = '';
            
            // Header row: corner + beach names
            html += '<div class="day-label corner-cell"></div>';
            beaches.forEach(beach => {
                html += `
                    <div class="beach-header">
                        <div class="beach-header-name">${beach.name}</div>
                        <div class="beach-header-en">${beach.nameEn}</div>
                    </div>
                `;
            });
            
            // Data rows: day label + cells
            dates.forEach((date, dayIndex) => {
                const label = getDayLabel(date, dayIndex);
                
                html += `
                    <div class="day-label">
                        <span class="day-label-date">${label.date}</span>
                        <span class="day-label-weekday">${label.day}曜日</span>
                        <span class="day-label-time">9:00-17:00</span>
                    </div>
                `;
                
                beaches.forEach(beach => {
                    const data = beachData[beach.name];
                    if (!data) {
                        html += '<div class="day-cell">-</div>';
                        return;
                    }
                    
                    const daytimeData = getDaytimeData(data.weatherData.hourly, date + 'T00:00');
                    const summary = summarizeDaytime(daytimeData);
                    
                    const cellKey = `${beach.name}-${dayIndex}`;
                    const isSelected = selectedCell === cellKey;
                    
                    if (summary) {
                        html += `
                            <div class="day-cell ${isSelected ? 'selected' : ''}" onclick="selectCell('${beach.name}', ${dayIndex}, '${date}')">
                                <div class="cell-wind-display">
                                    <div class="cell-wind-arrow" style="transform: rotate(${summary.avgDir}deg)">↓</div>
                                    <div class="cell-wind-info">
                                        <div class="cell-wind-speed">${summary.avgSpeed.toFixed(1)}<span class="cell-wind-unit">m/s</span></div>
                                        <div class="cell-wind-cardinal">${degreesToCardinal(summary.avgDir)}</div>
                                    </div>
                                </div>
                                <div class="cell-wind-range">${summary.minSpeed.toFixed(1)}-${summary.maxSpeed.toFixed(1)} m/s</div>
                                <div class="cell-hint">タップで詳細</div>
                            </div>
                        `;
                    } else {
                        html += '<div class="day-cell">-</div>';
                    }
                });
            });
            
            container.innerHTML = html;
        }

        function selectCell(beachName, dayIndex, dateStr) {
            const cellKey = `${beachName}-${dayIndex}`;
            
            if (selectedCell === cellKey) {
                closeHourlyPanel();
                return;
            }
            
            selectedCell = cellKey;
            renderMatrix();
            showHourlyPanel(beachName, dayIndex, dateStr);
        }

        function showHourlyPanel(beachName, dayIndex, dateStr) {
            const panel = document.getElementById('hourlyPanel');
            const title = document.getElementById('hourlyTitle');
            const subtitle = document.getElementById('hourlySubtitle');
            const grid = document.getElementById('hourlyGrid');
            
            const data = beachData[beachName];
            if (!data) return;
            
            const label = getDayLabel(dateStr, dayIndex);
            const allHours = getAllHoursData(data.weatherData.hourly, dateStr + 'T00:00');
            
            title.textContent = `${beachName} - ${label.date} (${label.day})`;
            subtitle.textContent = '24時間の風データ • ハイライト = 9:00-17:00';
            
            grid.innerHTML = allHours.map(h => `
                <div class="hour-item ${h.isDaytime ? 'daytime' : ''}">
                    <div class="hour-time">${h.hour}:00</div>
                    <span class="hour-arrow" style="transform: rotate(${h.windDir || 0}deg)">↓</span>
                    <div class="hour-speed">${h.windSpeed !== null ? h.windSpeed.toFixed(1) : '-'}</div>
                    <div class="hour-cardinal">${degreesToCardinal(h.windDir)}</div>
                </div>
            `).join('');
            
            panel.classList.add('visible');
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function closeHourlyPanel() {
            selectedCell = null;
            document.getElementById('hourlyPanel').classList.remove('visible');
            renderMatrix();
        }

        function findTideEvents(times, heights) {
            const events = [];
            for (let i = 1; i < heights.length - 1; i++) {
                if (heights[i] === null) continue;
                const prev = heights[i - 1], curr = heights[i], next = heights[i + 1];
                if (prev === null || next === null) continue;
                
                if (curr > prev && curr > next) events.push({ type: 'high', time: times[i], height: curr });
                else if (curr < prev && curr < next) events.push({ type: 'low', time: times[i], height: curr });
            }
            return events;
        }

        function drawTideChart(times, heights) {
            const canvas = document.getElementById('tideChart');
            const ctx = canvas.getContext('2d');
            
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            const width = rect.width, height = rect.height;
            const padding = { top: 30, right: 20, bottom: 40, left: 50 };
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;
            
            const validData = heights.map((h, i) => ({ height: h, time: times[i], index: i })).filter(d => d.height !== null);
            if (validData.length === 0) return;
            
            const minHeight = Math.min(...validData.map(d => d.height));
            const maxHeight = Math.max(...validData.map(d => d.height));
            const heightRange = maxHeight - minHeight || 1;
            
            ctx.clearRect(0, 0, width, height);
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            
            for (let i = 0; i <= 4; i++) {
                const y = padding.top + (chartHeight / 4) * i;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
                
                const heightVal = maxHeight - (heightRange / 4) * i;
                ctx.fillStyle = '#666';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(heightVal.toFixed(1) + 'm', padding.left - 8, y + 4);
            }
            
            ctx.fillStyle = '#666';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            
            for (let i = 0; i < times.length; i += 6) {
                const x = padding.left + (i / (times.length - 1)) * chartWidth;
                const date = new Date(times[i]);
                const hour = date.getHours();
                
                ctx.strokeStyle = hour === 0 ? 'rgba(255, 255, 255, 0.2)' : 'rgba(255, 255, 255, 0.05)';
                ctx.beginPath();
                ctx.moveTo(x, padding.top);
                ctx.lineTo(x, height - padding.bottom);
                ctx.stroke();
                
                ctx.fillStyle = '#666';
                ctx.fillText(date.toLocaleString('ja-JP', { hour: '2-digit', minute: '2-digit', hour12: false }), x, height - padding.bottom + 15);
                
                if (hour === 0) {
                    ctx.fillText(date.toLocaleString('ja-JP', { month: 'short', day: 'numeric' }), x, height - padding.bottom + 28);
                }
            }
            
            if (minHeight < 0 && maxHeight > 0) {
                const zeroY = padding.top + (maxHeight / heightRange) * chartHeight;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(padding.left, zeroY);
                ctx.lineTo(width - padding.right, zeroY);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            
            ctx.strokeStyle = '#00d9ff';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            
            let started = false;
            validData.forEach(d => {
                const x = padding.left + (d.index / (times.length - 1)) * chartWidth;
                const y = padding.top + ((maxHeight - d.height) / heightRange) * chartHeight;
                if (!started) { ctx.moveTo(x, y); started = true; } else { ctx.lineTo(x, y); }
            });
            ctx.stroke();
            
            const gradient = ctx.createLinearGradient(0, padding.top, 0, height - padding.bottom);
            gradient.addColorStop(0, 'rgba(0, 217, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 217, 255, 0.05)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            started = false;
            validData.forEach(d => {
                const x = padding.left + (d.index / (times.length - 1)) * chartWidth;
                const y = padding.top + ((maxHeight - d.height) / heightRange) * chartHeight;
                if (!started) { ctx.moveTo(x, height - padding.bottom); ctx.lineTo(x, y); started = true; } else { ctx.lineTo(x, y); }
            });
            if (validData.length > 0) {
                const lastX = padding.left + (validData[validData.length - 1].index / (times.length - 1)) * chartWidth;
                ctx.lineTo(lastX, height - padding.bottom);
            }
            ctx.closePath();
            ctx.fill();
            
            const now = new Date();
            const startTime = new Date(times[0]), endTime = new Date(times[times.length - 1]);
            
            if (now >= startTime && now <= endTime) {
                const nowProgress = (now - startTime) / (endTime - startTime);
                const nowX = padding.left + nowProgress * chartWidth;
                
                ctx.strokeStyle = '#ff6b6b';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(nowX, padding.top);
                ctx.lineTo(nowX, height - padding.bottom);
                ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText('NOW', nowX, padding.top - 8);
            }
            
            findTideEvents(times, heights).forEach(event => {
                const idx = times.indexOf(event.time);
                const x = padding.left + (idx / (times.length - 1)) * chartWidth;
                const y = padding.top + ((maxHeight - event.height) / heightRange) * chartHeight;
                
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = event.type === 'high' ? '#00d9ff' : '#ff6b6b';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        function renderTideEvents(times, heights) {
            const events = findTideEvents(times, heights);
            const container = document.getElementById('tideEvents');
            
            if (events.length === 0) {
                container.innerHTML = '<p style="color: #666; text-align: center;">No tide events found</p>';
                return;
            }
            
            container.innerHTML = events.slice(0, 8).map(event => {
                const date = new Date(event.time);
                return `
                    <div class="tide-event ${event.type}">
                        <div class="tide-event-type">${event.type === 'high' ? '満潮 High' : '干潮 Low'}</div>
                        <div class="tide-event-time">${date.toLocaleString('ja-JP', { hour: '2-digit', minute: '2-digit', hour12: false })}</div>
                        <div class="tide-event-height">${(event.height >= 0 ? '+' : '') + event.height.toFixed(2)}m</div>
                        <div class="tide-event-date">${date.toLocaleString('ja-JP', { month: 'short', day: 'numeric', weekday: 'short' })}</div>
                    </div>
                `;
            }).join('');
        }

        async function loadAllData() {
            const container = document.getElementById('forecastMatrix');
            const lastUpdated = document.getElementById('lastUpdated');
            
            container.innerHTML = `
                <div class="loading" style="grid-column: 1 / -1;">
                    <div class="loading-spinner"></div>
                    <p>データを取得中...</p>
                </div>
            `;
            closeHourlyPanel();

            try {
                Object.keys(apiResponses).forEach(key => delete apiResponses[key]);

                await Promise.all(beaches.map(async beach => {
                    const weather = await fetchWeatherData(beach.lat, beach.lon, beach.name);
                    beachData[beach.name] = { beach, weatherData: weather, dates: getUniqueDates(weather.hourly) };
                }));

                renderMatrix();

                const tideData = await fetchTideData(matsuyama.lat, matsuyama.lon);
                if (tideData.hourly?.time && tideData.hourly?.sea_level_height_msl) {
                    drawTideChart(tideData.hourly.time, tideData.hourly.sea_level_height_msl);
                    renderTideEvents(tideData.hourly.time, tideData.hourly.sea_level_height_msl);
                }

                renderTerminal();
                lastUpdated.textContent = `最終更新: ${formatTime(new Date())}`;
            } catch (error) {
                console.error('Error fetching data:', error);
                container.innerHTML = `
                    <div class="error" style="grid-column: 1 / -1;">
                        <p>⚠️ データの取得に失敗しました</p>
                        <p style="margin-top: 10px; font-size: 0.8rem;">${error.message}</p>
                    </div>
                `;
            }
        }

        function refreshData() {
            selectedCell = null;
            loadAllData();
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                const tideData = apiResponses['tide-matsuyama'];
                if (tideData?.response?.hourly) {
                    drawTideChart(tideData.response.hourly.time, tideData.response.hourly.sea_level_height_msl);
                }
            }, 250);
        });

        document.addEventListener('DOMContentLoaded', loadAllData);
        setInterval(loadAllData, 10 * 60 * 1000);
    </script>
</body>
</html>
